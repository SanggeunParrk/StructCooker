# manifest_full — the manifest with each protein node's seq_id and 40% cluster (cluster_key40 = the unit's set of
# clusters) and the entry's including_NA flag, plus report.md (counts and distributions). MATERIALIZE op, two outputs.
# Protein nodes are matched to sequences by md5("P:<sequence>") over the PDB protein fasta. Feeds interface/split.
recipe_path: ${p:src/structcooker/workflows/exports/interface_manifest_full.py}
output_data_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/manifest_full.tsv}
inputs:
  manifest_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/manifest.tsv}
  fasta_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/fasta/pdb_polypeptide_L.fasta}
  seq_id_map_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_id_map.tsv}
  cluster_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_cluster40_PDB.tsv}
  cif_metadata_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/cif_metadata.tsv}
  out_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/manifest_full.tsv}
  out_report: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/report.md}
