# manifest — one row per unit (type, node counts, atom / residue / contact / water counts, node hashes and ccd ids)
# from interface_pdb -> manifest.tsv. EXTRACT op. Feeds interface/manifest_full. No schema (a .tsv, not an LMDB).
db_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/interface_pdb.lmdb}
extract_recipe_path: ${p:src/structcooker/workflows/metadata/interface_manifest.py}
output_data_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/interface/pdb/manifest.tsv}

reader:
  deserializer: structcooker.instructions.transforms.codecs.from_bytes

writer:
  materializer: structcooker.instructions.interface.tables.write_manifest
