# Interface-unit DB of the PDB (docs/interface-db.md) as a dependency DAG.
#
# Units of 2..N touching molecules of a PDB bioassembly, stored with their waters. The shared PDB nodes it
# reads (pdb/cif, the protein fasta, seq_id_map, the 40% clusters, cif_metadata) are listed as roots so the set builds alone.
ccd/ccd: []
pdb/cif: [ccd/ccd]
metadata/cif_fasta: [pdb/cif]
metadata/cif_metadata: [pdb/cif]
metadata/pdb_polypeptide_L: [metadata/cif_fasta]
metadata/seq_id_map: [metadata/cif_fasta]
metadata/pdb_seq_cluster40: [metadata/seq_id_map, metadata/cif_fasta]

# ---- interface units ----
interface/antibody_cache: [metadata/pdb_polypeptide_L]
interface/interface_pdb: [pdb/cif, interface/antibody_cache]
interface/manifest: [interface/interface_pdb]
interface/manifest_full: [interface/manifest, metadata/pdb_polypeptide_L, metadata/seq_id_map, metadata/pdb_seq_cluster40, metadata/cif_metadata]
interface/split: [interface/manifest_full]
