# rfd4/rna_monomer_worklist — worklist of the RFD4-Proteina component 2026_09_21_rna_monomers: RNA monomer predictions (Protenix-v2, 371k). MATERIALIZE op.
# Reads the Hub's blob/index.parquet and examples.parquet; writes the worklist LMDB (one tiny row per record: where its CIF
# is in the shards, its date) that rfd4/rna_monomer builds from, the sidecar metadata/rfd4_rna_monomer_examples.parquet (everything else the
# Hub says about a record, joined on `key`) and the one-line list file that is this stage's output_data_path. docs/rfd4-sets.md.
recipe_path: ${p:src/structcooker/workflows/ingest/rfd4_worklist.py}
output_data_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/rfd4/rna_monomer/worklist.txt}
inputs:
  name: rna_monomer
  root: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/rfd4_proteina}
  out_lmdb: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/rfd4/rna_monomer/worklist.lmdb}
  out_sidecar: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/rfd4_rna_monomer_examples.parquet}
  out_list: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/rfd4/rna_monomer/worklist.txt}
