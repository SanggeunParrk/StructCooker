name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine is a submodule addressed by an ssh url; fetch it over https with a token that can read it
      # (secret SUBMODULE_TOKEN; the default token is enough when the engine repository is public).
      - name: Fetch the engine submodule
        env:
          TOKEN: ${{ secrets.SUBMODULE_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
      - name: Lint
        run: pixi run ruff check src tests scripts
      - name: Format
        run: pixi run ruff format --check src tests scripts
      - name: Types
        run: pixi run pyright
      - name: Tests
        run: pixi run pytest tests -q --cov=src/structcooker --cov-report=term
