site_name: StructCooker
site_description: A biomolecular domain package built on top of DataCooker.
site_url: https://SanggeunParrk.github.io/StructCooker/
repo_url: https://github.com/SanggeunParrk/StructCooker
repo_name: SanggeunParrk/StructCooker
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  datacooker_docs: https://CSSB-SNU.github.io/DataCooker/

nav:
  - Overview: index.md
  - End-to-end build: e2e-build.md
  - Stages: stages.md
  - Raw materials: raw-materials.md
  - seq_id and cluster scheme: seq-id-and-cluster-scheme.md
  - FoldBench DBs: foldbench.md
  - Interface DB: interface-db.md
  - Development: development.md
  - History:
      - Roadmap: history/roadmap.md
      - build-all DAG (31 nodes): history/build-all.md
      - Data provenance: history/data-provenance.md
      - PDB production: history/pdb-production.md
      - Release build: history/release-build.md
      - Manual CIF fixes: history/manual-cif-fixes.md
      - LMDB storage policy: history/lmdb-storage-policy.md
      - 2026-09-10 quality: history/quality-2026-09-10.md
      - 2026-09-10 recovery: history/recovery-2026-09-10.md
      - 2026-09-11 distillation CIF: history/distillation-cif-2026-09-11.md
      - 2026-09-14 long CIF recovery: history/long-cif-recovery-2026-09-14.md
      - 2026-09-15 distillation follow-up: history/distillation-followup-2026-09-15.md
      - 2026-09-17 reproducibility review: history/reproducibility-review-2026-09-17.md
      - RNA MSA sanitized exceptions: history/rna_msa_sanitized_exceptions.md
      - db/ ledger and release notes (to 2026-10-13): history/status-ledger-2026-10.md
