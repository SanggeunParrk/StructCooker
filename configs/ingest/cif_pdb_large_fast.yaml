# PDB revisit cif build, large tier (split by residue_num from cif_metadata.tsv).
file_list: ${p:/data/psk6950/BioMolDB_revisit/tiers/large.txt}
env_path: ${p:/data/psk6950/BioMolDB_revisit/cif_pdb_large_fast.lmdb}
recipe: ${p:src/structcooker/workflows/ingest/cif.py}
ccd_db_path: ${p:/data/psk6950/CCD/biomol_CCD_202602.lmdb}
n_jobs: 8
chunk_size: 100
test_run: false
reader:
  loader: structcooker.instructions.readers.cif.get_cif_data
  key_transform: structcooker.instructions.readers.cif.dot_transform
writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
