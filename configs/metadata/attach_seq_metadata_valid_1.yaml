# rebuild
old_env_path: ${p:/public_data02/BioMolDB_test/cif_valid_1.lmdb}
new_env_path: ${p:/public_data02/BioMolDB_test/cif_attached_valid_1.lmdb}

recipe: ${p:src/structcooker/workflows/attach_metadata.py}
metadata_recipe: ${p:src/structcooker/workflows/load_seq_metadata.py}

metadata_input:
  raw_fasta_path: ${p:/public_data02/BioMolDB_test/fasta/merged.fasta}
  seqid2seq_path: ${p:/public_data02/BioMolDB_test/metadata/seq_id_map.tsv}
  seqcluster_path: ${p:/public_data02/BioMolDB_test/metadata/seq_cluster30.tsv}


n_jobs: -1
chunk_size: 10000

reader:
  adapter: structcooker.readers.cifmol.convert_to_cifmol_transformed
  deserializer: structcooker.codecs.from_bytes

writer:
  serializer: structcooker.codecs.to_bytes
