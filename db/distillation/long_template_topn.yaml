# distillation_long template (top-N) — OpenFold3 long templates, coverage>=0.1, keep<=20.
# Mirror of openfold_template_topn_long. Schema D. Build. Joins cif_chain for chain mols.
# Full distillation builds authorized; require coverage and validation receipts.
schema: D

env_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/distillation_long/template/template_topn_long.lmdb}
data_dir: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/openfold_distillation/monomer_distillation_sets_v2/long_monomers/preprocessed}
file_pattern: "template.npz"

recipe: ${p:src/structcooker/workflows/ingest/openfold_template_topn.py}
key_builder: structcooker.instructions.readers.openfold.openfold_entry_key

inputs:
  cif_chain_db_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/cif/cif_chain.lmdb}
  min_coverage: 0.1
  max_keep: 20

reader:
  loader: structcooker.instructions.readers.openfold.get_openfold_template_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes

runtime_environment:
  # The 14 long entries whose structure.npz ends in stale bytes read the recovered copies
  # (scripts/staging/recover_ofd_long_npz.py; docs/history/long-cif-recovery-2026-09-14.md).
  OPENFOLD_STRUCTURE_OVERRIDES: ${oc.env:OPENFOLD_STRUCTURE_OVERRIDES,${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/openfold_distillation/long_recovered/overrides.json}
input_patterns: [template.npz, structure.npz]
