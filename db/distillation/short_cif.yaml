# distillation_short cif — CIFMol from OpenFold3 short distillation. Schema A. Build.
# Mirror of long_cif.yaml for the short set. Base structure build (feeds short_cif_attached).
# Code-complete; validate small vs production, do NOT full-build (per project rule).
schema: A

env_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/distillation_short/cif/cif_short.lmdb}
data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/monomer_distillation_sets_v2/short_monomers/preprocessed}
file_pattern: "structure.npz"

recipe: ${p:src/structcooker/workflows/ingest/openfold_structure.py}
key_builder: structcooker.instructions.readers.openfold.openfold_entry_key

inputs:
  ccd_db_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/ccd/biomol_CCD.lmdb}

reader:
  loader: structcooker.instructions.readers.openfold.get_openfold_structure_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
