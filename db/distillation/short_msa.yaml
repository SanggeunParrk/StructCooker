# distillation_short msa — OpenFold3 short alignments -> msa_dict. Schema E. Build.
# Mirror of openfold_msa_short. Base (depth 65536) msa; feeds short_msa_d2k / _d512 caps.
# Code-complete; validate small vs production, do NOT full-build (per project rule).
schema: E

env_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/distillation_short/msa/msa_short.lmdb}
data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/monomer_distillation_sets_v2/short_monomers/preprocessed}
file_pattern: "alignment.npz"

recipe: ${p:src/structcooker/workflows/ingest/openfold_msa.py}
key_builder: structcooker.instructions.readers.openfold.openfold_entry_key

inputs:
  a3m_type: protein
  max_depth: 65536

reader:
  loader: structcooker.instructions.readers.openfold.get_openfold_msa_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
