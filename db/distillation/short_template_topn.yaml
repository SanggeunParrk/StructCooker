# distillation_short template (top-N) — OpenFold3 short templates, coverage>=0.1, keep<=20.
# Mirror of openfold_template_topn_short. Schema D. Build. Joins cif_chain for chain mols.
# Code-complete; validate small vs production, do NOT full-build (per project rule).
schema: D

env_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/distillation_short/template/template_topn_short.lmdb}
data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/openfold_distillation/monomer_distillation_sets_v2/short_monomers/preprocessed}
file_pattern: "template.npz"

recipe: ${p:src/structcooker/workflows/ingest/openfold_template_topn.py}
key_builder: structcooker.instructions.readers.openfold.openfold_entry_key

inputs:
  cif_chain_db_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/cif/cif_chain.lmdb}
  min_coverage: 0.1
  max_keep: 20

reader:
  loader: structcooker.instructions.readers.openfold.get_openfold_template_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
