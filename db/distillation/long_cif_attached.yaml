# distillation_long cif_attached — attach sequence metadata onto the long base CIFMol.
# Schema B. Rebuild. Now unblocked: the base cif_long already uses the wrapped
# (assembly_dict/metadata_dict) layout the openfold_structure recipe emits, and the
# seq_id_map / seq_cluster metadata is on the clean surface. Mirrors
# configs/metadata/attach_cif_long_revisit. Full builds must include metadata and coverage audits.
schema: B

old_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/distillation_long/cif/cif_long.lmdb}
new_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/distillation_long/cif/cif_long_attached.lmdb}

recipe: ${p:src/structcooker/workflows/metadata/attach.py}
metadata_recipe: ${p:src/structcooker/workflows/metadata/load_sequence_metadata.py}
metadata_input:
  # Supplied long.fasta + the 14 entries recovered 2026-09-14 (appended; byte-identical prefix).
  raw_fasta_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/long_recovered_20260914/long.fasta}
  seqid2seq_path: ${p:${oc.env:REFERENCE_ROOT,${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}}/metadata/seq_id_map.tsv}
  seqcluster_path: ${p:${oc.env:REFERENCE_ROOT,${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}}/metadata/seq_cluster30_OFD.tsv}
  db_code: OFD

split_entries: true

reader:
  adapter: structcooker.instructions.transforms.cifmol.convert_to_cifmol_dict
  deserializer: structcooker.instructions.transforms.codecs.from_bytes
writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
