# distillation_disordered template — per-chain (chain_id keyed) 4-backbone-atom
# templates for protein chains. Mirror of openfold_template_disordered. Schema D.
# Build (file_list of protein template chains). Code-complete; validate small vs
# production before publication; full builds are authorized.
schema: D

env_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/distillation_disordered/template/template_disordered.lmdb}
file_list: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/reference/openfold_distillation/disordered_set/protein_tmpl_filelist.txt}
# Its lines are relative to the OpenFold download (datacooker resolves them against data_dir).
data_dir: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/openfold_distillation}

recipe: ${p:src/structcooker/workflows/ingest/openfold_template_disordered.py}
key_builder: structcooker.instructions.readers.openfold.openfold_chain_key

inputs:
  ccd_db_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/ccd/biomol_CCD.lmdb}

reader:
  loader: structcooker.instructions.readers.openfold.get_disordered_template_chain

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
