# template Phase 1/2 — precompute seq_id->chains + chain-><=topk templates + reduced hmm.
# MATERIALIZE op: the recipe writes all three outputs as side effects; output_data_path
# (chain_to_templates.tsv) is the build-done marker. Consumes Phase 0 hmm_output.
recipe_path: ${p:src/structcooker/workflows/ingest/template_candidates.py}
output_data_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/chain_to_templates.tsv}
inputs:
  cif_fasta: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/fasta/cif_pdb.fasta}
  chain_list: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/template_chain_filelist.txt}
  seq_id_map: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_id_map.tsv}
  pdb_dates: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/cif_metadata.tsv}
  hmm_dir: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/hmm_output}
  out_seqid_chains: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seqid_to_chains.tsv}
  out_chain_templates: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/chain_to_templates.tsv}
  out_reduced_hmm_dir: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/hmm_reduced}
  date_cutoff: "2021-09-30"
  day_diff: 60
  topk: 20
  n_jobs: 112
