# template Phase 3 — seq_id -> union template mols (+ template_ids). Schema D. Build.
# KEYED build (items are seq_ids, not files -> planner sizes by count). Runs kalign +
# template-mol build ONCE per seq_id (deduped ~5.7x vs per-chain), reading templates
# from cif_chain by key. Upstream (Phase 1/2, still script-only): the reduced HMMs +
# the seq maps + the seq_id filelist come from the hmmsearch/candidate pipeline.
schema: D

env_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/template/seqid_template_mols.lmdb}
file_list: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seqid_template_filelist.txt}
keyed: true

recipe: ${p:src/structcooker/workflows/ingest/seqid_template_mols.py}
key_builder: structcooker.instructions.readers.openfold.openfold_chain_key

metadata_recipe: ${p:src/structcooker/workflows/metadata/load_template_seqs.py}
metadata_input:
  seqid_seq_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seqid_to_seq.tsv}
  chain_seq_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/chain_to_seq.tsv}

inputs:
  reduced_hmm_dir: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/hmm_reduced}
  cif_chain_db_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/cif/cif_chain.lmdb}

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
