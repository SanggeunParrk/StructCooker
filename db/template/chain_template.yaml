# template Phase 4 — final chain-keyed template DB via lookup into the Phase 3 seq_id
# DB. Schema D. KEYED build (items are chain-ids). Pure keyed read + select, so it is
# light and high-parallelism. Upstream: the Phase 3 DB + the seqid->chains /
# chain->templates maps + the chain filelist.
schema: D

env_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/template/template.lmdb}
file_list: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/worklists/template_chain_filelist.txt}
keyed: true

recipe: ${p:src/structcooker/workflows/ingest/chain_template_from_seqid.py}
key_builder: structcooker.instructions.readers.openfold.openfold_chain_key

metadata_recipe: ${p:src/structcooker/workflows/metadata/load_phase4_maps.py}
metadata_input:
  seqid_chains_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/worklists/seqid_to_chains.tsv}
  chain_templates_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/worklists/chain_to_templates.tsv}

inputs:
  seqid_template_db_path: ${p:${oc.env:BIOMOL_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/chain/template/seqid_template_mols.lmdb}

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
