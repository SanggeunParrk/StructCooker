split_recipe_path: ${p:src/structcooker/workflows/search/load_a3m_list.py}
recipe_path: ${p:src/structcooker/workflows/filters/a3m_cleanup.py}
inputs:
  data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/intermediate/msa}
  output_dir: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/intermediate/msa_wo_lower}
  output_pattern: ".a3m"
n_jobs: -1
test_run: false
