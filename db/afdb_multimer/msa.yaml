# afdb_multimer msa — the release's own MSAs -> msa LMDB. Schema E. Build.
#
# 1,799,837 MSAs (every monomer entity an AFM structure uses; docs/raw-materials.md), in the
# release's ColabFold a3m format: zstd-compressed, opening with a "#<len>\t<card>" line that
# get_a3m_data skips. Keyed by seq_id (metadata/afm_msa_seqid), like every MSA DB -- so
# entities sharing a sequence collapse, keeping the first.
# Lineage: MMseqs2-GPU / colabfold_search vs uniref30_2302 with a per-taxon filter -- the
# release's, not the HHblits cascade PDB/OFD MSAs came from. One entity the release does not
# ship was generated (msa_generated/README.md).
# 1.72M MSAs merge to ~1.09 TB (8 x 136 GB shards) -- past the 300 GB default map, which
# failed the first merge (job 273638, MDB_MAP_FULL). A map is a ceiling, not an allocation.
map_size: 1_500_000_000_000
schema: E

env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/afdb_multimer/msa/msa_afm.lmdb}
data_dir: ${p:${oc.env:AFDB_MULTIMER_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/raw/afdb_multimer}/msa}
file_pattern: "*/AF-*-msa_v1.a3m.zst"

recipe: ${p:src/structcooker/workflows/ingest/a3m.py}
key_builder: structcooker.instructions.readers.afdb.afm_msa_seqid_key

reader:
  loader: structcooker.instructions.readers.a3m.get_a3m_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
test_run: false

runtime_environment:
  AFM_MSA_SEQID_MAP: ${oc.env:AFM_MSA_SEQID_MAP,${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/afm_msa_seqid.tsv}
duplicate_input_policy: first_path
