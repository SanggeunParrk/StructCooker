# Teddymer DB set as a dependency DAG.
#
# WHAT THIS BUILDS — 510,454 entries, not the full 10,089,503.
#   Teddymer ships 10,089,503 TED domain-pair dimers, clustered by Foldseek-Multimer into
#   3,556,223 clusters (587,687 non-singleton + 2,968,536 singleton). Interface quality
#   (InterfaceLength / AvgIntPAE / AvgIntPlddt) is published ONLY for non-singleton cluster
#   representatives, so only those can be filtered at all.
#
#   Applying the source paper's filter (interface length > 10, interface-pAE < 10,
#   interface-pLDDT > 70) to those 587,687 leaves 510,454 -- reproduced exactly here
#   [measured 2026-09-22]. That selection is what scripts/maintenance/stage_teddymer.py
#   stages and what teddymer/cif builds.
#
# WHY NOT MORE. Two larger sets were measured and rejected:
#   • members of the passing clusters (6,656,838 entries) hold 1,242,908 unique interface
#     clusters vs 375,307 for the representatives -- 3.3x the diversity -- but need
#     11,490,249 MSAs instead of 999,853, an 11.5x cost. MSA generation is the binding
#     constraint, so the representatives win.
#   • the 2,968,536 singletons carry no interface metrics at all; admitting them means
#     computing interface pAE from the source AFDB models first.
#
# SEQ ID SPACE — shared with pdb + distillation, not separate [decided 2026-09-22].
#   seq_id is an assigned counter keyed by (molecule-type prefix + sequence), so a separate
#   teddymer space would reuse the same "P0000..." strings for different sequences and the
#   two DBs could not be joined. Sharing keeps one meaning per id.
#   Clustering is per DB (cTDM_<rep seq_id>, metadata/teddymer_seq_cluster30), so adding
#   teddymer moved no PDB/OFD cluster label.
#
# MSA + TEMPLATE. teddymer/msa_search (MMseqs2 vs uniref30_2302) writes the a3m files to
# BioMol_clean/materials/intermediate/msa over the metadata/teddymer_seq_id_map list; run it
# multi-node with submits/search/msa_search_mmseqs_teddymer.sh (the CLI runs a parallel op on
# one node). teddymer/msa and teddymer/msa_wo_lower read that tree.

metadata/cif_fasta: []                                  # PDB fasta (template chain seqs); built in MANIFEST.yaml
metadata/cif_metadata: []                               # PDB release dates; built in MANIFEST.yaml
chain/cif_chain: []                                     # per-chain PDB LMDB (template mols); built in MANIFEST.yaml
ccd/ccd: []                                  # root: the CCD LMDB every cif build reads
teddymer/cif: [ccd/ccd]                       # + the staged selection (see above)
metadata/teddymer_fasta: [teddymer/cif]
metadata/seq_id_map: [metadata/teddymer_fasta, metadata/cif_fasta]          # shared id space; teddymer joins it
metadata/teddymer_seq_id_map: [metadata/teddymer_fasta, metadata/seq_id_map]   # MSA search work list
metadata/teddymer_seq_cluster30: [metadata/teddymer_fasta, metadata/seq_id_map]
teddymer/cif_attached: [teddymer/cif, metadata/teddymer_fasta, metadata/seq_id_map, metadata/teddymer_seq_cluster30]
metadata/pdb_polypeptide_L: [metadata/cif_fasta]        # template target; built in MANIFEST.yaml
teddymer/msa_search: [metadata/teddymer_seq_id_map]
teddymer/msa: [teddymer/msa_search]
teddymer/msa_d2k: [teddymer/msa]
teddymer/msa_wo_lower: [teddymer/msa_search]
teddymer/hmmsearch: [teddymer/msa_wo_lower, metadata/pdb_polypeptide_L]   # template Phase 0 (submits/search/hmmsearch_teddymer.sh)
teddymer/template_candidates: [teddymer/hmmsearch, metadata/teddymer_seq_id_map, metadata/cif_metadata, metadata/cif_fasta]   # Phase 1/2 per seq_id
teddymer/template: [teddymer/template_candidates, chain/cif_chain]                  # Phase 3 + top-20 -> final DB
