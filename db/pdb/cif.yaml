# cif_pdb — raw mmCIF → CIFMol {assembly_dict, metadata_dict}. Schema A. Build.
#
# Replaces the 10 hand-tuned size variants (cif_pdb_{light,medium,large,xlarge,
# huge,monster,smoke,...}.yaml): the planner sizes each file by st_size×E and
# tiers them automatically, so there is no file_list / n_jobs / chunk_size here.
schema: A

env_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/pdb/cif/cif_pdb.lmdb}
data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/rcsb/cif}
file_pattern: "*.cif.gz"

recipe: ${p:src/structcooker/workflows/ingest/cif.py}
ccd_db_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/ccd/biomol_CCD.lmdb}

reader:
  loader: structcooker.instructions.readers.cif.get_cif_data
  key_transform: structcooker.instructions.readers.cif.dot_transform

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
