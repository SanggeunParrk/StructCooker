# a3m_d16k — a3m capped to depth 16000. Schema E. Rebuild from a3m.lmdb.
# Planning-first replacement for scripts/maintenance/lightweight_msa.py: routed
# through DataCooker so it inherits bounded Ray execution and input-size balancing.
# Targets are written under OUTPUT_ROOT; production inputs are read-only.
schema: E

old_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/pdb/msa/a3m.lmdb}
new_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/pdb/msa/a3m_d16k.lmdb}

recipe: ${p:src/structcooker/workflows/exports/cap_msa_depth.py}

parameters:
  max_depth: 16000


reader:
  adapter: structcooker.instructions.transforms.openfold.adapt_msa_for_cap
  deserializer: structcooker.instructions.transforms.codecs.from_bytes

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
