# a3m — per-sequence MSA from .a3m files. Schema E. Build.
# Clean planning-first build: items are real *.a3m files, so the planner sizes
# them by st_size×E directly (unlike the template key-list builds).
schema: E

env_path: ${p:/data/shared/cssb_data/BioMol_clean/lmdb/pdb/msa/a3m.lmdb}
data_dir: ${p:/data/shared/cssb_data/BioMol/materials/intermediate/msa}
file_pattern: "P*.a3m"

recipe: ${p:src/structcooker/workflows/ingest/a3m.py}

reader:
  loader: structcooker.instructions.readers.a3m.get_a3m_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
