# teddymer cif — TED domain-pair PDB → CIFMol {assembly_dict, metadata_dict}. Schema A. Build.
#
# Teddymer is a domain-domain interface set, not a protein-protein complex set: each entry
# is two TED domains of ONE AFDB v4 model, split into chains A/B. See db/MANIFEST_teddymer.yaml
# for how the 510,454-entry selection is defined and staged.
#
# Reuses the openfold structure steps verbatim; the only teddymer-specific step is the bond
# derivation a PDB needs (workflows/ingest/teddymer_structure.py).
schema: A

# Individual sources can be unreadable in a 10M-file tree; skip them like pdb/cif does
# rather than letting one bad file abort a shard.
test_run: false

env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/teddymer/cif/cif_teddymer.lmdb}
# The staged selection, not the full 10,089,503-file dump: scanning the raw dirs would
# enumerate 20x the inputs we build. scripts/maintenance/stage_teddymer.py copies the
# selected entries here and writes SOURCE.tsv recording where each came from.
data_dir: ${p:${oc.env:TEDDYMER_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/raw/teddymer}}
file_pattern: "*.pdb"

recipe: ${p:src/structcooker/workflows/ingest/teddymer_structure.py}
key_builder: structcooker.instructions.readers.teddymer.teddymer_entry_key

inputs:
  ccd_db_path: ${p:${oc.env:REFERENCE_ROOT,${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}}/ccd/biomol_CCD.lmdb}

reader:
  loader: structcooker.instructions.readers.teddymer.get_teddymer_structure_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
