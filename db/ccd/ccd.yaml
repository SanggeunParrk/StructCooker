# ccd — CCD chem-component reference DB from component .cif files. Schema G. Build.
# Reference/support DB (input to cif ingest via ccd_db_path), not a training DB.
#
# Input: the wwPDB Chemical Component Dictionary, `structcooker download ccd`, which keeps the
# download as raw (BioMol/materials/raw/ccd/components_<date>.cif.gz; this build:
# components_20260803.cif.gz) and splits it into one <COMP_ID>.cif per `data_` block under
# BioMol/materials/intermediate/ccd/components -- the split files are ours, not the download.
env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/ccd/biomol_CCD.lmdb}
# Split components: an input made from the raw download, under DATA_ROOT (not OUTPUT_ROOT).
data_dir: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/intermediate/ccd/components}
file_pattern: "*.cif*"

recipe: ${p:src/structcooker/workflows/ingest/ccd.py}

reader:
  loader: structcooker.instructions.readers.cif.get_cif_data

writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
