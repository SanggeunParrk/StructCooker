# valid stage 2 — dedup vs train/valid_1 sequences + interacting clusters. Schema B.
# Rebuild of the ATTACHED valid_1 DB. Upstream (multi-stage DAG): valid_1 -> attach ->
# cif_attached_valid_1, plus train/valid_1 fasta + seq_cluster30 + interacting_clusters.
schema: B
split_entries: true  # reader adapter fans each entry into cif_key sub-records; feed the recipe per sub-record
old_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/pdb/valid/cif_attached_valid_1.lmdb}
new_env_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/pdb/valid/cif_attached_valid_2.lmdb}
recipe: ${p:src/structcooker/workflows/filters/validation_stage2.py}
metadata_recipe: ${p:src/structcooker/workflows/filters/validation_stage2_metadata.py}
metadata_input:
  raw_fasta_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/cif_pdb.fasta}
  train_fasta_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/train.fasta}
  valid_1_fasta_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/valid_1.fasta}
  seqid2seq_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/seq_id_map.tsv}
  seqcluster_path: ${p:${oc.env:SEQ_CLUSTER30_PATH,${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/seq_cluster30_PDB.tsv}}
  db_code: PDB
  interacting_seq_clusters_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/interacting_seq_clusters.tsv}
reader:
  adapter: structcooker.instructions.transforms.cifmol.convert_to_cifmol_attached_transformed
  deserializer: structcooker.instructions.transforms.codecs.from_bytes
writer:
  serializer: structcooker.instructions.transforms.codecs.to_bytes
