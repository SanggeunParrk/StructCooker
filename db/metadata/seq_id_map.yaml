# seq_id_map — sequence -> assigned seq_id. The identity key that threads the whole
# BioMol DB set (a3m / templates / attach / clusters are all keyed by seq_id).
# MATERIALIZE op: run the recipe over the merged fasta, project the map to a TSV.
#
# ┌─ EXCEPTION: reproducing the production id space ─────────────────────────────┐
# │ seq_id is an ASSIGNED running counter (mol-type prefix + ordinal), NOT a hash │
# │ of the sequence, so a from-scratch build yields a self-consistent but         │
# │ DIFFERENT id space. Which id space this DB uses is part of the DB's DEFINITION,│
# │ so it lives here in the config, not in an env var: `old_seq_id_map_path` is a  │
# │ provided reference input under DATA_ROOT/reference/.                           │
# │   • MATCH prod  -> provide the production map at that path (ids then match).    │
# │   • fresh set   -> leave the file absent; the recipe mints a new coherent set. │
# └──────────────────────────────────────────────────────────────────────────────┘
recipe_path: ${p:src/structcooker/workflows/metadata/seq_id_map.py}

inputs:
  # PDB + distillation sequences share one id space, so the map ingests every fasta the
  # downstream attach / MSA seq_id keying needs (not just cif_pdb).
  fasta_paths:
    - ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/fasta/cif_pdb.fasta}
    - ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/fasta/short.fasta}
    - ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/fasta/long.fasta}
    - ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/fasta/rna.fasta}
    - ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/openfold_distillation/fasta/disordered.fasta}
  # Provided reference seed: present -> match production's id space; absent -> fresh ids.
  old_seq_id_map_path: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/reference/seq_id_map.tsv}

output_data_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_id_map.tsv}

writer:
  materializer: structcooker.instructions.writers.projections.write_seq_id_map
