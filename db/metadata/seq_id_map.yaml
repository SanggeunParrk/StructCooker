# seq_id_map — sequence -> assigned seq_id. The identity key that threads the whole
# BioMol DB set (a3m / templates / attach / clusters are all keyed by seq_id).
# MATERIALIZE op: run the recipe over the merged fasta, project the map to a TSV.
#
# ┌─ EXCEPTION: reproducing the production id space ─────────────────────────────┐
# │ seq_id is an ASSIGNED running counter (mol-type prefix + ordinal), NOT a hash │
# │ of the sequence, so a from-scratch build yields a self-consistent but         │
# │ DIFFERENT id space. Which id space this DB uses is part of the DB's DEFINITION,│
# │ so it lives here in the config, not in an env var: `old_seq_id_map_path` is a  │
# │ provided reference input under DATA_ROOT/reference/.                           │
# │   • MATCH prod  -> provide the production map at that path (ids then match).    │
# │   • fresh set   -> leave the file absent; the recipe mints a new coherent set. │
# └──────────────────────────────────────────────────────────────────────────────┘
recipe_path: ${p:src/structcooker/workflows/metadata/seq_id_map.py}

inputs:
  # EVERY DB shares this one id space -- the id names a sequence, so two DBs holding the
  # same sequence must agree on it or nothing joins across them. Clustering is what is
  # per-DB, not identity (docs/seq-id-and-cluster-scheme.md). So the map ingests every
  # DB's fasta, and each DB clusters its own.
  fasta_paths:
    - ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/cif_pdb.fasta}
    - ${p:${oc.env:DISTILLATION_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/openfold_distillation}/fasta/short.fasta}
    - ${p:${oc.env:DISTILLATION_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/openfold_distillation}/fasta/long.fasta}
    - ${p:${oc.env:DISTILLATION_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/openfold_distillation}/fasta/rna.fasta}
    - ${p:${oc.env:DISTILLATION_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol/materials/openfold_distillation}/fasta/disordered.fasta}
    - ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/teddymer.fasta}
    # AFM LAST. seq_id is a counter assigned in order of first appearance, so a DB appended
    # at the end leaves every earlier DB's ids exactly as they were -- teddymer's included,
    # whose attached DB is already built. Insert a DB anywhere else and later ids shift.
    - ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/afm.fasta}
    # 14 OFD long entries recovered 2026-09-14 (docs/long-cif-recovery-2026-09-14.md) are in no
    # supplied fasta. Their recovery-version ids (P...16902258-71) were issued in a separate
    # namespace and are now held by other sequences here, so they get fresh ids at the end.
    - ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/materials/raw/fasta/ofd_long_recovered.fasta}
  # Provided reference seed: present -> match production's id space; absent -> fresh ids.
  old_seq_id_map_path: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/reference/seq_id_map.tsv}

output_data_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/seq_id_map.tsv}

writer:
  materializer: structcooker.instructions.writers.projections.write_seq_id_map
