# seq_cluster40 — mmseqs2 sequence clusters at 0.40 identity (antibodies via cd-hit).
# MATERIALIZE op (recipe -> cluster TSV). Feeds attach / valid / template dedup.
#
# Inputs it needs (provided/upstream):
#   • seq_id_map (from db/metadata/seq_id_map) — provides the seq_id space this uses
#   • fasta to cluster — a PROVIDED reference corpus at
#     DATA_ROOT/reference/seqcluster_corpus.fasta (the pdb+distillation union, to
#     match production's cluster labels). Deterministic given corpus+params+version.
#   • SabDab antibody summary — external download, like CCD/mmCIF (DATA_ROOT/external).
recipe_path: ${p:src/structcooker/workflows/search/seq_cluster.py}
output_data_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_cluster40.tsv}

inputs:
  tmp_dir: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/tmp/seq_cluster40}
  seq_id_map_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/metadata/seq_id_map.tsv}
  # Provided reference corpus: production clustered the pdb+distillation UNION.
  # It is part of what this DB IS, so it lives here (not an env var); provide the
  # union fasta at this path. mmseqs2 is deterministic given corpus+params+version.
  fasta_path: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/reference/seqcluster_corpus.fasta}
  sabdab_summary_path: ${p:${oc.env:DATA_ROOT,/data/shared/cssb_data}/external/SabDab/sabdab_summary_all.tsv}
  mmseqs2_seq_id: 0.40
  mmseqs2_cov: 0.8
  mmseqs2_covmode: "0"
  mmseqs2_clustermode: "1"

writer:
  materializer: structcooker.instructions.writers.projections.write_clusters
