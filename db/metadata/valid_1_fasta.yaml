# valid_1_fasta — chain sequences from valid/valid1 -> fasta (valid2 dedup input).
# EXTRACT op. Must be extracted from OUR cif_valid_1 (header-consistent with cif_pdb.fasta);
# production's valid_1.fasta carries different auth-chain labels.
db_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/lmdb/pdb/valid/cif_valid_1.lmdb}
extract_recipe_path: ${p:src/structcooker/workflows/exports/fasta_transformed.py}
output_data_path: ${p:${oc.env:OUTPUT_ROOT,/data/shared/cssb_data/BioMol_clean}/materials/raw/fasta/valid_1.fasta}

reader:
  deserializer: structcooker.instructions.transforms.codecs.from_bytes

writer:
  materializer: structcooker.instructions.writers.projections.write_fasta
