# Extract the existing attached chain contact graph; no per-record metadata load.
n_jobs: 8
db_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/lmdb/pdb/cif_attached/cif_pdb_attached.lmdb}
extract_recipe_path: ${p:src/structcooker/workflows/exports/interacting_seq_ids.py}
output_data_path: ${p:${oc.env:OUTPUT_ROOT,${oc.env:DATA_ROOT,/data/shared/cssb_data}/BioMol_clean}/metadata/interacting_seq_ids.tsv}
reader:
  deserializer: structcooker.instructions.transforms.codecs.from_bytes
writer:
  materializer: structcooker.instructions.writers.projections.write_filtered_seq_ids
