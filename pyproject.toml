[project]
name = "StructCooker"
version = "0.1.0"
description = "Benchmark Codes for structure prediction"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sanggeun Park", email = "psk6950@snu.ac.kr" }]
dependencies = [
    "biopython>=1.85,<2",
    "click>=8.1.8,<9",
    "joblib >=1.4.2,<2",
    "lmdb>=1.6.2,<2",
    "omegaconf>=2.3.0,<3",
    "zstandard>=0.24.0,<1",
    "typing_extensions>=4.15.0,<5",
    "numpy>=2.2.6,<3",
    "networkx>=3.2",
    "biomol>=1.0.0",
    "kalign-python==3.5.1",
    "ray>=2.56,<3",
]

[project.scripts]
structcooker = "structcooker.cli:main"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
# Principled ignores for a CLI + data-pipeline library (kept in sync with
# libs/datacooker/pyproject.toml). Everything else is fixed, not suppressed.
ignore = [
    "F722",  # Incompatible with jaxtyping
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # complexity: pipelines are wide
    "PLR2004",  # magic values read fine in numeric/scientific code
    "N806",  # scientific names (N, L, ...) are conventional here
    "E501",  # long lines (formatter-owned)
    "ANN401",  # workflow payloads are intentionally Any
    "FBT001", "FBT002", "FBT003",  # click exposes flags as boolean params
    "TC001", "TC002", "TC003",  # postponed-eval annotations make runtime imports fine
    "COM812",  # formatter-compatible trailing commas
]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts and don't need docstrings/annotations on helpers.
"tests/**" = ["S101", "D101", "D103", "ANN", "INP001", "PLR2004", "TC003"]
# Maintenance/ops scripts: print-based progress logs and inline magic values are fine.
"scripts/**" = ["T201", "INP001", "PLR2004", "PLR0913", "PLR0915", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pixi.workspace]
channels = ["conda-forge","bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
structcooker = { path = ".", editable = true }
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6,<10"
datacooker = { path = "libs/datacooker", editable = true }


[tool.pixi.dependencies]
python = "~=3.10"
ruff = ">=0.11.6,<0.12"
pytest = ">=8.4.1,<9"
ipykernel = ">=6.30.1,<7"
hmmer = "==3.3.2"
anarci = "*"
cd-hit = "*"
mmseqs2 = "*"   # protein sequence clustering (seq_cluster); cd-hit is for antibodies


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
  "src/structcooker",
]


[tool.pyright]
include = ["src", "libs/datacooker/src"]
extraPaths = ["src", "libs/datacooker/src"]
venvPath = ".pixi/envs"
venv = "default"
enableReachabilityAnalysis = false
